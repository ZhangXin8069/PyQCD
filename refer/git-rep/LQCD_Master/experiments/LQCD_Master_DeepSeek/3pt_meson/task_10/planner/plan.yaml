task:
  name: anti_Bs0_to_Ds_plus_3pt
  description: >-
    Three-point correlation function for anti-Bs0 -> Ds+ semileptonic transition
    via b->c vector current. Source: anti-Bs0 (anti-s b) at t=0 with gamma_5
    interpolator. Sink: Ds+ (anti-s c) at t=8 with gamma_5 interpolator. Current:
    bar(c) gamma_x b (spatial vector). Point source at [0,0,0,0], zero momentum.
    Stout-smeared gauge links (n_steps=1, rho=0.125, ndim=4). Sequential source
    at t_sink=8 constructed from the forward strange propagator via the standard
    two-dagger convention. Only 3pt computed; no 2pt.
  task_mode: standard

ensemble:
  preset: C24P29
  cfg_num:
    - '10000'
  cfg_path: /public/share/weiwang/clqcd/beta6.20_mu-0.2770_ms-0.2400_L24x72/Configurations/Original/beta6.20_mu-0.2770_ms-0.2400_L24x72_cfg_{n_cfg}.lime
  dimensions:
    - 24
    - 24
    - 24
    - 72
  boundary_conditions:
    spatial: periodic
    temporal: anti-periodic
  lattice_spacing: 0.1052
  anisotropy: 1.0
  quark_mass:
    light: -0.277
    strange: -0.2356
    charm: 0.4159
    bottom: 1.5
  xi_0: 1.0
  clover: 1.160920226
  multigrid:
    - - 6
      - 6
      - 6
      - 3
    - - 4
      - 4
      - 4
      - 6
  mpi_num: 4
  process_grid:
    - 1
    - 1
    - 1
    - 4

physics:
  observables:
    - id: antiBs0_to_Dsplus_3pt
      type: meson_3pt
      name: "anti-Bs0 -> Ds+ transition via b->c vector current"
      notes: >-
        Semileptonic decay matrix element with vector current insertion.
        Current: bar(c) gamma_x b (spatial x-component). Zero momentum transfer.
        Sink time t_sink = 8, sequential source method. The full Wick contraction
        is worked out below; the overall sign is + (not -) after careful trace
        of all minus signs from the operator conjugate, the single fermion loop,
        and gamma_5-hermiticity.

  hadrons:
    - id: anti_Bs0
      name: anti-Bs0
      type: meson
      flavor: "anti-s b"
      momentum: [0, 0, 0]
      interpolating_operator: "bar(s) gamma_5 b"
      subtype: source
      notes: >-
        anti-Bs0 meson (flavour b anti-s). Interpolator O = bar(s)γ₅ b.
        Dirac conjugate (creation operator): O† = -bar(b)γ₅ s.
        The minus sign is essential for the overall 3pt sign.
    - id: Ds_plus
      name: Ds+
      type: meson
      flavor: "c anti-s"
      momentum: [0, 0, 0]
      interpolating_operator: "bar(s) gamma_5 c"
      subtype: sink
      notes: >-
        Ds+ meson (flavour c anti-s). Interpolator O = bar(s)γ₅ c.
        Used as the sink operator at t=8.

  propagators:
    - id: prop_s
      quark_flavor: strange
      source:
        source_type: point
        source_position: [0, 0, 0, 0]
        source_momentum: [0, 0, 0]
      gauge_field:
        stout_link_smear:
          enabled: true
          parameters:
            rho: 0.125
            n_steps: 1
            ndim: 4
      solver:
        id: cg_strange_multigrid
        quark_mass: -0.2356
        clover_coefficient: 1.160920226
        tolerance: 1.0e-12
        maxiter: 5000
        notes: >-
          Multigrid-preconditioned CG for strange spectator quark.
          This propagator serves two roles: (a) spectator line from source
          to sink, and (b) the kernel for constructing the sequential source
          at t=8 via η = γ₅ S_s γ₅.
      sink:
        id: sink_point
        type: point

    - id: prop_b
      quark_flavor: bottom
      source:
        source_type: point
        source_position: [0, 0, 0, 0]
        source_momentum: [0, 0, 0]
      gauge_field:
        stout_link_smear:
          enabled: true
          parameters:
            rho: 0.125
            n_steps: 1
            ndim: 4
      solver:
        id: cg_bottom
        quark_mass: 1.5
        clover_coefficient: 1.160920226
        tolerance: 1.0e-12
        maxiter: 2000
        notes: >-
          CG solver for heavy bottom quark. Caveat: bare am_b ≈ 1.5 at
          a ≈ 0.105 fm is far above the physical bottom scale; discretisation
          errors may be large. A Fermilab or RHQ action would be preferred
          for a production run, but for this single-configuration exploratory
          calculation the standard clover action is used as provided by the
          C24P29 ensemble. Convergence is rapid for heavy quarks (maxiter
          2000 is generous).
      sink:
        id: sink_point
        type: point

    - id: prop_c_seq
      quark_flavor: charm
      source:
        source_type: sequential
        source_position: [null, null, null, 8]
        source_momentum: [0, 0, 0]
        sequential:
          forward_propagator: prop_s
          sink_operator: "bar(s) gamma_5 c"
          sink_gamma: gamma_5
          t_sink: 8
          sink_block_definition: >-
            From the Wick contraction C3 = +Σ Tr[S_s(0;x) γ₅ S_c(x;z) γ_x S_b(z;0) γ₅],
            the sink block is B(x) = S_s(0;x) γ₅  (restricted to t=t_f=8).
            Applying γ₅-hermiticity to the full trace gives the equivalent
            form C3 = +Σ Tr[S_s†(x;0) S_c(x;z) γ_x S_b(z;0)], from which
            one reads the sink block as B'(x) = S_s†(x;0).
            
            Under the standard two-dagger convention η = γ₅ B† γ₅:
              η(x) = γ₅ [S_s(0;x) γ₅]† γ₅ = γ₅ γ₅ S_s†(0;x) γ₅
                   = S_s†(0;x) γ₅ = γ₅ S_s(x;0) γ₅   (by γ₅-hermiticity)
            Equivalently: η(x) = S_s†(0;x)  (both forms are identical).
            
            This is a source vector defined on the t=8 time slice for all
            spatial points x. It encodes the entire sink structure (spectator
            propagator + pseudoscalar gamma matrix).
          notes: >-
            Sequential source constructed from prop_s at t=8 via the two-dagger
            convention. The source is η(x) = γ₅ S_s(x;8) γ₅ = S_s†(0;x),
            restricted to the t=8 time slice. One sequential inversion per
            sink setup.
      gauge_field:
        stout_link_smear:
          enabled: true
          parameters:
            rho: 0.125
            n_steps: 1
            ndim: 4
      solver:
        id: cg_charm
        quark_mass: 0.4159
        clover_coefficient: 1.160920226
        tolerance: 1.0e-12
        maxiter: 5000
        notes: "CG solver for charm sequential propagator"
      sink:
        id: sink_point
        type: point

measurement:
  correlators:
    - id: C3_antiBs0_Dsplus
      type: meson_3pt
      source_hadron: anti_Bs0
      sink_hadron: Ds_plus
      current: "bar(c) gamma_x b"
      current_gamma: gamma_x
      forward_propagator: prop_b
      sequential_propagator: prop_c_seq
      spectator_propagator: prop_s
      observable: antiBs0_to_Dsplus_3pt
      sink_time: 8
      notes: >-
        Full Wick contraction derivation:
        
        (1) Operators:
            O_src = bar(s)γ₅ b,  O_src† = -bar(b)γ₅ s  (minus sign!)
            O_snk = bar(s)γ₅ c
            J_x   = bar(c)γ_x b
        
        (2) Three-point correlator (p_src = p_snk = 0):
            C3 = ⟨O_snk(t_f) J_x(τ) O_src†(0)⟩
               = -Σ_{x,z} ⟨bar(s)γ₅c(x) · bar(c)γ_x b(z) · bar(b)γ₅ s(0)⟩
        
        (3) Wick contraction (one fermion loop → factor -1):
            ⟨s̅ c c̅ b b̅ s⟩ → -S_s(0;x) S_c(x;z) S_b(z;0)
        
        (4) Assembling:
            C3 = -(-1) Σ Tr[S_s(0;x) γ₅ S_c(x;z) γ_x S_b(z;0) γ₅]
               = + Σ Tr[S_s(0;x) γ₅ S_c(x;z) γ_x S_b(z;0) γ₅]   (OVERALL SIGN = +)
        
        (5) γ₅-hermiticity + cyclic permutation simplifies to:
            C3 = + Σ Tr[S_s†(x;0) S_c(x;z) γ_x S_b(z;0)]
        
        (6) Sequential-source implementation:
            Sink block: B = S_s†(x;0)  (on t=t_f=8 time slice)
            Seq. source: η = γ₅ B† γ₅ = γ₅ S_s γ₅ = S_s†(0;x)
            Solve: D_c G_seq = η
            Second dagger: G̃_seq = γ₅ G_seq† γ₅
            Final contraction:
              C3(τ) = + Σ_z Tr[G̃_seq(z,τ) γ_x S_b(z,τ;0)]
        
        (7) Sign summary:
            • Source conjugate:        -1
            • One fermion loop (Wick):  -1
            • Product:                 +1
            • Final: C3 = +Tr[G_seq γ_x S_b]
        
        Only the connected diagram exists; no disconnected contributions
        for this flavour combination (b→c transition with anti-s spectator).
        One sequential inversion per sink setup.
        
        Validation note: the sign can be checked against the known result
        for a pseudoscalar→pseudoscalar transition with γ₅ current, where
        the Wick sign is well established.

output:
  format: txt
  metadata: false
  filename: "C3_antiBs0_to_Dsplus.txt"
  description: >-
    Two-column ASCII: tau  C3_re(tau). No header, no metadata. One row per
    current-insertion time slice tau = 0, 1, ..., 8 (or up to T-1 as available
    from the sequential solve). The real part of the 3pt correlator. The sign
    convention is C3 = +Tr[G_seq γ_x S_b] as derived from the full Wick
    contraction.

extras:
  - "Only 3pt function computed; no 2pt"
  - "Point source at spacetime origin [0,0,0,0]"
  - "Sequential source at t_sink=8 via η = γ₅ S_s γ₅ = S_s†(0;x)"
  - "Stout-smeared gauge links: n_steps=1, rho=0.125, ndim=4"
  - "Zero momentum (p_src = p_snk = 0)"
  - "Vector current gamma_x (spatial x-component)"
  - "Overall sign of C3 = + (source conjugate minus × fermion-loop minus = +)"
  - "Single configuration (cfg 10000); statistical error not estimated"
  - "Bottom at bare am_b=1.5; discretisation errors may be significant"