task:
  name: Lambda_c_to_Lambda_3pt_vector
  description: >
    Compute the three-point correlation function for Lambda_c+ -> Lambda
    via the (c->s) vector current (gamma_x).  Point source at [0,0,0,0],
    zero momentum, sink at t_seq=8, positive-parity projector T=(1+gamma_4)/2.
    Only the 3pt function is computed (no 2pt).
  task_mode: standard

physics:
  observables:
    - id: lambdac_lambda_3pt
      type: baryon_3pt
      name: "Lambda_c+ to Lambda vector current 3pt"

  hadrons:
    - id: Lambda_c_plus
      name: "Lambda_c+"
      type: baryon
      flavor: "udc"
      momentum: [0, 0, 0]
      interpolating_operator: "epsilon^{abc} (u^{Ta} C gamma_5 d^b) c^c"
      role: source

    - id: Lambda
      name: "Lambda"
      type: baryon
      flavor: "uds"
      momentum: [0, 0, 0]
      interpolating_operator: "epsilon^{abc} (u^{Ta} C gamma_5 d^b) s^c"
      role: sink

  propagators:
    - id: prop_l
      quark_flavor: light
      source:
        source_type: point
        source_position: [0, 0, 0, 0]
        source_momentum: [0, 0, 0]
      gauge_field:
        stout_link_smear:
          enabled: true
          parameters:
            rho: 0.125
            n_steps: 1
            ndim: 4
      solver:
        id: mg_light
        quark_mass: -0.277
        clover_coefficient: 1.160920226
        tolerance: 1.0e-12
        maxiter: 5000
        notes: "Multigrid inverter for light quark.  Supplies u,d in diquark at both source and sink."
      sink:
        id: sink_l
        type: point

    - id: prop_c
      quark_flavor: charm
      source:
        source_type: point
        source_position: [0, 0, 0, 0]
        source_momentum: [0, 0, 0]
      gauge_field:
        stout_link_smear:
          enabled: true
          parameters:
            rho: 0.125
            n_steps: 1
            ndim: 4
      solver:
        id: cg_charm
        quark_mass: 0.4159
        clover_coefficient: 1.160920226
        tolerance: 1.0e-12
        maxiter: 10000
        notes: "CG inverter for forward charm propagator from point source.  Charm mass is positive and well-conditioned for CG."
      sink:
        id: sink_c
        type: point

    - id: prop_s_seq
      quark_flavor: strange
      source:
        source_type: sequential
        source_position: [0, 0, 0, 8]
        source_momentum: [0, 0, 0]
        notes: >
          Sequential source built at t=8 from the Lambda sink.  CRITICAL:
          the B-block is constructed by summing over ALL spatial points x
          at time slice t=8 (effectively a wall source).  The forward prop_l
          forms the (ud) diquark with C*gamma_5 at the sink and gamma_5*C
          from the source diquark.  The projector T=(1+gamma_4)/2 is applied
          across the sink s-quark and source c-quark spin indices.  The
          sequential source follows the two-dagger convention:
          eta_seq = gamma_5 * B^dagger * gamma_5.
          Only ONE contraction topology exists (no exchange term) because
          c and s are unique flavours connected by the current.
      gauge_field:
        stout_link_smear:
          enabled: true
          parameters:
            rho: 0.125
            n_steps: 1
            ndim: 4
      solver:
        id: bicgstab_strange_seq
        quark_mass: -0.2356
        clover_coefficient: 1.160920226
        tolerance: 1.0e-12
        maxiter: 10000
        notes: >
          BiCGstab inverter for strange sequential propagator.  BiCGstab is
          used instead of plain CG because the strange-quark Wilson mass
          (-0.2356) may render the Dirac operator non-positive-definite;
          BiCGstab handles non-Hermitian systems robustly.
      sink:
        id: sink_s_seq
        type: point

measurement:
  correlators:
    - id: threept_lambdac_lambda
      type: baryon_3pt
      propagators: [prop_l, prop_c, prop_s_seq]
      observable: lambdac_lambda_3pt
      source_hadron: Lambda_c_plus
      sink_hadron: Lambda
      current:
        gamma: gamma_x
        flavor_change: "c_to_s"
        type: vector
      projector: "(1 + gamma_4) / 2"
      t_seq: 8
      notes: >
        Single contraction topology (no exchange term): the current connects
        distinct quark flavours (c->s), so there is only one Wick
        contraction.  Final correlator at each current-insertion time tau:

          C3(tau) = sum_{z} Tr[ prop_s_seq(z, tau) * gamma_x * prop_c(z, tau) ]

        where the sum runs over ALL spatial lattice sites z at time slice
        tau.  The sequential-source B-block einsum and the final contraction
        einsum are generated by generate_einsum (baryon_3pt type).

output:
  format: txt
  metadata: false
  file: "lambda_c_to_lambda_3pt.txt"
  notes: >
    Plain text: one correlator value per time slice for tau = 0, 1, ...,
    t_seq (=8).  Output exactly 9 values.  Do NOT include time slices
    beyond t_seq (current insertion after the sink is unphysical).
    No header, no metadata, no extra text.

extras:
  - "Do not compute any 2pt functions."
  - "All inversions use stout-smeared links (n_steps=1, rho=0.125, ndim=4)."
  - "Run on a single configuration (cfg 10000)."
  - "The sequential source is a wall source: the B-block sums over ALL spatial points x at t=8.  The source_position spatial entries [0,0,0] are placeholders; the source spans the entire spatial volume."
  - "Output exactly t_seq+1 = 9 lines (tau = 0 through tau = 8)."
  - "Use generate_einsum with baryon_3pt type for the B-block sequential-source construction and final contraction.  The projector (1+gamma_4)/2 must be wired between the sink s-quark and source c-quark spin indices."

ensemble:
  preset: C24P29
  cfg_num:
    - '10000'
  cfg_path: "/public/share/weiwang/clqcd/beta6.20_mu-0.2770_ms-0.2400_L24x72/Configurations/Original/beta6.20_mu-0.2770_ms-0.2400_L24x72_cfg_{n_cfg}.lime"
  dimensions:
    - 24
    - 24
    - 24
    - 72
  boundary_conditions:
    spatial: periodic
    temporal: anti-periodic
  lattice_spacing: 0.1052
  anisotropy: 1.0
  quark_mass:
    light: -0.277
    strange: -0.2356
    charm: 0.4159
    bottom: 1.5
  xi_0: 1.0
  clover: 1.160920226
  multigrid:
    - [6, 6, 6, 3]
    - [4, 4, 4, 6]
  mpi_num: 4
  process_grid: [1, 1, 1, 4]