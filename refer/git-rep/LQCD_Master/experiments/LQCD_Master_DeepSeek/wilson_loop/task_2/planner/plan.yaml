task:
  name: wilson_loop_R1_T2
  description: |
    Compute rectangular Wilson loop W(R=1, T=2) averaged over XT, YT, and ZT planes
    using unsmeared gauge links. Pure-gauge measurement; no quark propagators or
    fermion inversions required. Save the final scalar result to a plain text file.
  task_mode: freeform

ensemble:
  preset: C24P29
  cfg_num:
