task:
  name: wilson_loop_R1_T1
  description: >
    Compute the rectangular Wilson loop W(R=1,T=1) averaged over XT, YT, and ZT planes
    using unsmeared gauge links. Pure-gauge measurement only: no quark propagators,
    Dirac solvers, or fermion inversions. Save result as a single float to a plain text file.
  task_mode: freeform

ensemble:
  preset: C24P29
  cfg_num:
  - '10000'
  cfg_path: /public/share/weiwang/clqcd/beta6.20_mu-0.2770_ms-0.2400_L24x72/Configurations/Original/beta6.20_mu-0.2770_ms-0.2400_L24x72_cfg_{n_cfg}.lime
  dimensions:
  - 24
  - 24
  - 24
  - 72
  boundary_conditions:
    spatial: periodic
    temporal: anti-periodic
  lattice_spacing: 0.1052
  anisotropy: 1.0
  quark_mass:
    light: -0.277
    strange: -0.2356
    charm: 0.4159
    bottom: 1.5
  xi_0: 1.0
  clover: 1.160920226
  multigrid:
  - - 6
    - 6
    - 6
    - 3
  - - 4
    - 4
    - 4
    - 6
  mpi_num: 4
  process_grid:
  - 1
  - 1
  - 1
  - 4

physics:
  observables:
    - id: wilson_loop_R1_T1
      type: wilsonloop
      name: "Rectangular Wilson loop W(R=1,T=1), plane-averaged (XT / YT / ZT)"

output:
  format: txt
  metadata: false

extras:
  - "Pure-gauge measurement — no fermion propagators or Dirac inversions required"
  - "No gauge link smearing of any kind (stout, APE, HYP) is applied"
  - "Result written as a single float value to {work_dir}/wilson_loop_R1_T1_cfg10000.txt with no header or extra text"

freeform_plan: |
  ## Physics Objective
  Compute the 1×1 rectangular Wilson loop W(R=1, T=1) — the spatial-temporal
  plaquette — on a single gauge configuration (cfg 10000) and average over the
  three spatial-temporal planes (XT, YT, ZT). This is the simplest non-trivial
  gauge-invariant observable, directly related to the gauge action density
  via ⟨s_g⟩ = β (1 − ⟨P⟩). No fermion degrees of freedom are involved.

  ## Observable Definition
  W(R=1, T=1) = (1/N_c) Re Tr[U_μ U_ν U_μ^† U_ν^†]  with N_c = 3, evaluated
  on three planes and site-averaged:
    - XT plane: path = [X, T, −X, −T]
    - YT plane: path = [Y, T, −Y, −T]
    - ZT plane: path = [Z, T, −Z, −T]

  ## Computational Workflow

  ### 1. PyQUDA Initialization
  - Lattice: [24, 24, 24, 72]
  - MPI process grid: [1, 1, 1, 4]  (4 ranks in the t-direction)
  - Backend: cupy (GPU)
  - Tunecache directory passed as runtime argument

  ### 2. Gauge Configuration Loading
  - Read the single Chroma QIO (.lime) file:
    beta6.20_mu-0.2770_ms-0.2400_L24x72_cfg_10000.lime
    from the path specified in ensemble.cfg_path.
  - Transfer gauge field to device via .toDevice().
  - **Explicitly do NOT apply any stout, APE, or HYP smearing.**
    Use raw unsmeared gauge links throughout.

  ### 3. Wilson Loop Path Construction
  - R = 1, T = 1 for all three planes.
  - Build three paths using PyQUDA direction constants:
      path_XT = [X, T, -X, -T]
      path_YT = [Y, T, -Y, -T]
      path_ZT = [Z, T, -Z, -T]
  - Pack into the 4-group format required by gauge.loop():
      groups = [[path_XT], [path_YT], [path_ZT], [path_XT]]
      weights = [1, 1, 1, 0]
    (The fourth group is a dummy, weighted zero.)

  ### 4. Wilson Loop Evaluation
  - Call res = gauge.loop(groups, weights).
  - For each active plane i ∈ {0, 1, 2}:
      * Transfer to host:  U = res[i].getHost()
      * Flatten sites:     U_flat = U.reshape(-1, 3, 3)
      * Per-site real trace:  re_tr_i = np.trace(U_flat, axis1=-2, axis2=-1).real
  - Plane-averaged per-site trace:
      re_tr_avg = (re_tr_0 + re_tr_1 + re_tr_2) / 3.0

  ### 5. MPI Global Reduction
  - Reshape re_tr_avg to the local lattice shape:
      (2, 18, 24, 24, 12)   for grid [1,1,1,4] on [24,24,24,72]
  - Sum across ranks:  global_sum = core.gatherLattice(field, [-1, -1, -1, -1])
  - On rank 0:
      total_sites = 24 × 24 × 24 × 72 = 995328
      W = float(global_sum.sum()) / (total_sites × 3)

  ### 6. Output
  - On rank 0 only, open wilson_loop_R1_T1_cfg10000.txt and write the single
    float value of W with no header, no label, and no trailing whitespace.
  - The file is placed in the current working directory.

  ## Physical Expectations
  For this β ≈ 6.20 ensemble the plaquette is expected near 0.58–0.60,
  consistent with a confined phase. The observable is purely real.

  ## Implementation Notes
  - Uses PyQUDA's gauge.loop() with the mandatory 4-group packing convention.
  - MPI reduction uses core.gatherLattice(), not raw mpi4py.
  - No fermion inversions, no propagators, no Dirac operators are needed.
  - The script is a flat, self-contained Python file launched via
    `mpirun -np 4 python wilson_loop_R1_T1.py <tunecache_path>`.