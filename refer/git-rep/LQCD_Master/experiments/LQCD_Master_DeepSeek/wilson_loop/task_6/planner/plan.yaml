task:
  name: wilson_loop_R3_T1
  description: >
    Compute the rectangular Wilson loop W(R=3, T=1) averaged over the XT, YT,
    and ZT spatial-temporal planes on a single gauge configuration using the
    original unsmeared gauge links. Pure-gauge measurement only: load gauge
    links, compute Wilson loops via gauge.loop(), and reduce to a single
    scalar. No quark propagators, Dirac solvers, or fermion inversions. No
    stout/APE/HYP link smearing of any kind. Result written as a plain
    floating-point value (no header, no metadata) to wilson_loop_R3_T1.txt.
  task_mode: freeform

