task:
  name: wilson_loop_R1_T4
  description: >-
    Compute rectangular Wilson loop W(R=1, T=4) averaged over XT, YT, and ZT planes.
    Pure-gauge measurement using unsmeared gauge links. No quark propagators, Dirac
    solvers, or fermion inversions. Save the final value to a plain text file.
  task_mode: freeform

