task:
  name: wilson_loop_R2_T2_three_planes
  description: >
    Compute the rectangular Wilson loop W(R=2, T=2) averaged over XT, YT,
    and ZT planes using unsmeared gauge links. Pure-gauge measurement,
    no quark propagators or Dirac inversions. Save the per-configuration
    scalar result to a plain-text file.
  task_mode: freeform

physics:
  observables:
    - id: wl_R2_T2
      type: wilsonloop
      name: Wilson loop W(R=2, T=2)
  hadrons: []
  propagators: []

measurement:
  correlators: []

output:
  format: txt
  metadata: false

extras:
  - No stout smearing or any gauge-link smearing
  - Average over XT, YT, ZT planes by computing all three plane loops with equal weight 1/3
  - Per-site ReTr averaged over all lattice sites after MPI gather
  - Final result written as a single float to wl_R2_T2_cfg{cfg_num}.txt in the run directory

freeform_plan: |
  ## Physics goal
  Measure the expectation value of the rectangular Wilson loop W(R=2, T=2)
  as a pure-gauge observable, averaging over the three spatial-temporal
  planes (XT, YT, ZT) to improve statistics.  The Wilson loop is defined as

      W_{\mu\nu}(R,T) = (1/N_c) Re Tr P[ U_\mu ... U_\nu ... U_\mu^\dagger ... U_\nu^\dagger ]

  with N_c = 3.  No link smearing is applied; the original unsmeared gauge
  links are used directly.

  ## Lattice and ensemble
  Configuration C24P29, 24^3 × 72, a ≈ 0.1052 fm, periodic spatial BC,
  anti-periodic temporal BC.  A single configuration with cfg_num = 10000
  is processed.

  ## Computational steps

  1. **Initialize PyQUDA** with grid_size = [1, 1, 1, 4] and
     latt_size = [24, 24, 24, 72].

  2. **Load the gauge configuration** from the LIME-format Chroma QIO file
     using `io.readChromaQIOGauge(cfg_path)` and transfer to GPU via
     `gauge.toDevice()`.  NO stout smearing or APE/HYP smearing is applied.

  3. **Construct Wilson loop paths** for R = 2, T = 2:
     - XT plane: [X, X, T, T, -X, -X, -T, -T]
     - YT plane: [Y, Y, T, T, -Y, -Y, -T, -T]
     - ZT plane: [Z, Z, T, T, -Z, -Z, -T, -T]

  4. **Call gauge.loop()** with exactly 4 outer groups:
       groups = [[path_XT], [path_YT], [path_ZT], [path_XT]]
       weights = [1, 1, 1, 0]
     (The fourth group is a dummy, weighted 0, to satisfy PyQUDA's
     requirement of exactly 4 groups.)

  5. **Extract per-site ReTr** for each of the three active planes (i=0,1,2):
       U = res[i].getHost().reshape(-1, 3, 3)
       re_tr[i] = trace(U, axis1=-2, axis2=-1).real
     then average:  re_tr_avg = (re_tr[0] + re_tr[1] + re_tr[2]) / 3.0

  6. **MPI gather** using `core.gatherLattice(field, [-1,-1,-1,-1])`.
     The local field is reshaped to match the even-odd layout
     (2, Lt/grid[3], Lz, Ly, Lx/grid[0]//2).  On rank 0, sum the
     gathered array and divide by (total_sites × N_c) to obtain the
     configuration-averaged Wilson loop value.

  7. **Save** the single scalar as plain text (one line, no header) to
       wl_R2_T2_cfg10000.txt
     in the current run directory.  Write only the float value, e.g.,
     "0.12345678".

  ## Statistics and systematics
  - Only one configuration is processed; no jackknife/bootstrap is
    performed at this stage.
  - Multi-plane averaging improves the per-configuration signal by
    exploiting the cubic symmetry of the lattice.
  - No smearing is applied, so the Wilson loop may be somewhat noisy;
    this is acceptable for a single-configuration measurement.
  - The anti-periodic temporal BC does not affect Wilson loops with
    T = 2 ≪ L_t.