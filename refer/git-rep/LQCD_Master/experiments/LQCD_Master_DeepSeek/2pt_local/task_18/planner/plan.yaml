task:
  name: sigma_c_plus_2pt
  description: >
    Compute the zero-momentum two-point correlation function of the Sigma_c+ (udc) baryon
    using a point source at [0,0,0,0] with stout-smeared gauge links (n_steps=1, rho=0.125, ndim=4).
    The interpolating operator is epsilon^{abc} (u^{Ta} C*gamma_1 d^b) c^c, using Cg1 (=C@gamma_x)
    for the flavor-symmetric (I=1) ud diquark.  Because gamma_1 is antisymmetric under transpose
    in the DeGrand-Rossi basis (gamma_1^T = -gamma_1), the source diquark structure after
    gamma_5-hermiticity and transpose yields -(C*gamma_1), producing an overall minus sign in the
    contraction relative to the C*gamma_5 case used for the proton.  Positive parity is projected
    with Tmat = (1+gamma_t)/2.  IMPORTANT: The C*gamma_1 vector diquark couples to both
    J^P = 1/2^+ (Sigma_c+, ground state) and J^P = 3/2^+ (Sigma_c*+, excited state).  The parity
    projector alone isolates positive parity but does NOT separate these spin states.  The lighter
    Sigma_c+(1/2^+) is expected to dominate at large Euclidean time.  Only the Cg1 gamma structure
    is used — no averaging over spatial directions.
  task_mode: standard

ensemble:
  preset: C24P29
  cfg_num:
    - '10000'
  cfg_path: /public/share/weiwang/clqcd/beta6.20_mu-0.2770_ms-0.2400_L24x72/Configurations/Original/beta6.20_mu-0.2770_ms-0.2400_L24x72_cfg_{n_cfg}.lime
  dimensions:
    - 24
    - 24
    - 24
    - 72
  boundary_conditions:
    spatial: periodic
    temporal: anti-periodic
  lattice_spacing: 0.1052
  anisotropy: 1.0
  quark_mass:
    light: -0.277
    strange: -0.2356
    charm: 0.4159
    bottom: 1.5
  xi_0: 1.0
  clover: 1.160920226
  multigrid:
    - - 6
      - 6
      - 6
      - 3
    - - 4
      - 4
      - 4
      - 6
  mpi_num: 4
  process_grid:
    - 1
    - 1
    - 1
    - 4

physics:
  observables:
    - id: sigma_c_plus_mass
      type: baryon_2pt
      name: Sigma_c+ two-point function

  hadrons:
    - id: sigma_c_plus
      name: Sigma_c+
      type: baryon
      flavor: udc
      momentum: [0, 0, 0]
      interpolating_operator: "epsilon^{abc} (u^{Ta} C*gamma_1 d^b) c^c"
      subtype: positive_parity

  propagators:
    - id: prop_l
      quark_flavor: light
      source:
        source_type: point
        source_position: [0, 0, 0, 0]
        source_momentum: [0, 0, 0]
      gauge_field:
        stout_link_smear:
          enabled: true
          parameters:
            rho: 0.125
            n_steps: 1
            ndim: 4
      solver:
        id: solver_light
        quark_mass: -0.277
        clover_coefficient: 1.160920226
        tolerance: 1.0e-12
        maxiter: 20000
        notes: "CG solver with multigrid preconditioner; blocking levels [[6,6,6,3],[4,4,4,6]]"
      sink:
        id: sink_point
        type: point

    - id: prop_c
      quark_flavor: charm
      source:
        source_type: point
        source_position: [0, 0, 0, 0]
        source_momentum: [0, 0, 0]
      gauge_field:
        stout_link_smear:
          enabled: true
          parameters:
            rho: 0.125
            n_steps: 1
            ndim: 4
      solver:
        id: solver_charm
        quark_mass: 0.4159
        clover_coefficient: 1.160920226
        tolerance: 1.0e-12
        maxiter: 20000
        notes: "Standard CG solver (charm quark is heavy; multigrid may not accelerate)"
      sink:
        id: sink_point
        type: point

measurement:
  correlators:
    - id: sigma_c_plus_2pt_corr
      type: baryon_2pt
      propagator: [prop_l, prop_c]
      observable: sigma_c_plus_mass

output:
  format: txt
  metadata: false

extras:
  - "Use Cg1 = C @ gamma_x for the ud diquark; no averaging over spatial directions"
  - "Use projector Tmat = (1 + gamma_t) / 2 for positive parity extraction"
  - "Save raw correlator data as plain text without headers to the run directory"
  - "prop_l is reused for both u and d quark lines in the baryon contraction"
  - "Source diquark transpose yields -(C*gamma_1) for gamma_1 (unlike +C*gamma_5 for gamma_5); overall minus sign must be handled correctly by generate_einsum"
  - "The C*gamma_1 vector diquark couples to both J^P=1/2^+ and J^P=3/2^+; parity projector alone does not separate spin states"
  - "generate_einsum must support per-quark-line propagator assignment for mixed-flavor baryons: quark_lines=[prop_l, prop_l, prop_c]"