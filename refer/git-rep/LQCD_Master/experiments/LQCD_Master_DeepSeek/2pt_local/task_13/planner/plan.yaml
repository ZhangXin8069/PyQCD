task:
  name: sigma_minus_2pt
  description: >
    Two-point correlation function of the Sigma- baryon (quark content dds)
    using the interpolating operator with Cγ₅ diquark structure.
    Positive-parity projection with (I+γ₄)/2.
    Point source at origin [0,0,0,0] on a single configuration.
    Both light (d) and strange (s) propagators are inverted using
    stout-smeared gauge links (1 step, ρ=0.125, 4-dim).
  task_mode: standard

ensemble:
  preset: C24P29
  cfg_num:
    - '10000'
  cfg_path: /public/share/weiwang/clqcd/beta6.20_mu-0.2770_ms-0.2400_L24x72/Configurations/Original/beta6.20_mu-0.2770_ms-0.2400_L24x72_cfg_{n_cfg}.lime
  dimensions:
    - 24
    - 24
    - 24
    - 72
  boundary_conditions:
    spatial: periodic
    temporal: anti-periodic
  lattice_spacing: 0.1052
  anisotropy: 1.0
  quark_mass:
    light: -0.277
    strange: -0.2356
    charm: 0.4159
    bottom: 1.5
  xi_0: 1.0
  clover: 1.160920226
  multigrid:
    - - 6
      - 6
      - 6
      - 3
    - - 4
      - 4
      - 4
      - 6
  mpi_num: 4
  process_grid:
    - 1
    - 1
    - 1
    - 4

physics:
  observables:
    - id: sigma_minus_2pt
      type: baryon_2pt
      name: Sigma- two-point function

  hadrons:
    - id: sigma_minus
      name: Sigma-
      type: baryon
      flavor: dds
      momentum: [0, 0, 0]
      interpolating_operator: "epsilon^{abc} (d^{Ta} C gamma_5 d^b) s^c"
      subtype: positive_parity

  propagators:
    - id: prop_l
      quark_flavor: light
      source:
        source_type: point
        source_position: [0, 0, 0, 0]
        source_momentum: [0, 0, 0]
      gauge_field:
        stout_link_smear:
          enabled: true
          parameters:
            rho: 0.125
            n_steps: 1
            ndim: 4
      solver:
        id: solver_light
        quark_mass: -0.277
        clover_coefficient: 1.160920226
        tolerance: 1.0e-12
        maxiter: 20000
        notes: "Light (d) quark propagator with stout-smeared gauge links"
      sink:
        id: sink_point
        type: point

    - id: prop_s
      quark_flavor: strange
      source:
        source_type: point
        source_position: [0, 0, 0, 0]
        source_momentum: [0, 0, 0]
      gauge_field:
        stout_link_smear:
          enabled: true
          parameters:
            rho: 0.125
            n_steps: 1
            ndim: 4
      solver:
        id: solver_strange
        quark_mass: -0.2356
        clover_coefficient: 1.160920226
        tolerance: 1.0e-12
        maxiter: 20000
        notes: "Strange (s) quark propagator with stout-smeared gauge links"
      sink:
        id: sink_point
        type: point

measurement:
  correlators:
    - id: sigma_minus_corr
      type: baryon_2pt
      propagator:
        - prop_l
        - prop_s
      observable: sigma_minus_2pt

output:
  format: txt
  metadata: false

extras:
  - "Diquark gamma matrix: Cγ₅ (C@gamma_5). Required by the Pauli principle: both d quarks are identical, so the total wavefunction must be antisymmetric. Color ε^{abc} is antisymmetric (A), flavor is symmetric (S, both d), spatial S-wave is symmetric (S). The spin-Dirac structure must therefore be antisymmetric (A) to satisfy A×S×S×A = A overall. (Cγ₅)^T = −Cγ₅ provides the required antisymmetry, whereas (Cγ₁)^T = +Cγ₁ would give an identically vanishing operator."
  - "Parity projector: P⁺ = (I + γ₄) / 2"
  - "Single point source at origin [0,0,0,0]"
  - "Stout smearing on gauge links: 1 step, ρ=0.125, ndim=4"
  - "Output: raw correlator values as plain text, no header"
  - "Note: the conjugate (source) operator gamma structure with Cγ₅ differs from Cγ₁. The einsum generator (generate_einsum) must handle the sign from γ₄(Cγ₅)†γ₄ C correctly. The downstream toolchain should be verified to produce the correct contraction with Cγ₅ rather than Cγ₁."