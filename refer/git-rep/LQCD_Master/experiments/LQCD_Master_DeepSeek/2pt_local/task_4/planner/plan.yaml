ensemble:
  preset: C24P29
  cfg_num:
  - '10000'
  cfg_path: /public/share/weiwang/clqcd/beta6.20_mu-0.2770_ms-0.2400_L24x72/Configurations/Original/beta6.20_mu-0.2770_ms-0.2400_L24x72_cfg_{n_cfg}.lime
  dimensions:
  - 24
  - 24
  - 24
  - 72
  boundary_conditions:
    spatial: periodic
    temporal: anti-periodic
  lattice_spacing: 0.1052
  anisotropy: 1.0
  quark_mass:
    light: -0.277
    strange: -0.2356
    charm: 0.4159
    bottom: 1.5
  xi_0: 1.0
  clover: 1.160920226
  multigrid:
  - - 6
    - 6
    - 6
    - 3
  - - 4
    - 4
    - 4
    - 6
  mpi_num: 4
  process_grid:
  - 1
  - 1
  - 1
  - 4

task:
  name: etac_two_point
  description: >
    Calculate the two-point correlation function of the eta_c (ηc) meson,
    the ground-state pseudoscalar charmonium (c-cbar, J^{PC}=0^{-+}).
    Uses a point source at [0,0,0,0] with stout-smeared gauge links
    (n_steps=1, rho=0.125, ndim=4) for the Dirac inversion.
    Only the connected (OZI-leading) diagram is computed; disconnected
    contributions are OZI-suppressed for charmonium and omitted.
    Zero momentum projection at both source and sink.
  task_mode: standard

physics:
  observables:
    - id: etac_mass
      type: meson_2pt
      name: eta_c two-point correlator

  hadrons:
    - id: etac
      name: eta_c
      type: meson
      flavor: c-cbar
      momentum: [0, 0, 0]
      interpolating_operator: \bar{c} \gamma_5 c
      subtype: pseudoscalar

  propagators:
    - id: prop_c
      quark_flavor: charm
      source:
        source_type: point
        source_position: [0, 0, 0, 0]
        source_momentum: [0, 0, 0]
      gauge_field:
        stout_link_smear:
          enabled: true
          parameters:
            rho: 0.125
            n_steps: 1
            ndim: 4
      solver:
        id: mg_charm
        quark_mass: 0.4159
        clover_coefficient: 1.160920226
        tolerance: 1.0e-12
        maxiter: 10000
        notes: Multigrid solver for Wilson-clover charm quark propagator
      sink:
        id: sink_point
        type: point

measurement:
  correlators:
    - id: etac_2pt
      type: meson_2pt
      propagator: prop_c
      observable: etac_mass

output:
  format: txt
  metadata: false

extras:
  - "Only connected diagram computed; disconnected (OZI-suppressed) omitted for charmonium"
  - "Zero-momentum projection: source and sink both at p=(0,0,0)"
  - "Plain text output (no header), one correlator value per time slice, saved to run directory"