task:
  name: lambda_b_to_lambda_c_axial_3pt_exploratory
  description: Compute a single bare zero-momentum Lambda_b to Lambda_c+ three-point correlator with axial current J_x^A = cbar gamma_x gamma_5 b, using the source operator epsilon^{abc}(u^{Ta} C gamma_5 d^b) b^c, the sink operator epsilon^{abc}(u^{Ta} C gamma_5 d^b) c^c, the positive-parity projector Tmat=(I+gamma_t)/2, a point source at [0,0,0,0], tseq=8, and stout-smeared gauge links for all inversions. This plan intentionally produces only the raw 3pt correlator and does not compute any 2pt functions; because the b quark is represented here only by the fixed ensemble/clover input, the result must be treated as an exploratory bare correlator rather than a controlled physical Lambda_b decay form factor.
  task_mode: standard

ensemble:
  preset: C24P29
  cfg_num:
    - '10000'
  cfg_path: /public/share/weiwang/clqcd/beta6.20_mu-0.2770_ms-0.2400_L24x72/Configurations/Original/beta6.20_mu-0.2770_ms-0.2400_L24x72_cfg_{n_cfg}.lime
  dimensions:
    - 24
    - 24
    - 24
    - 72
  boundary_conditions:
    spatial: periodic
    temporal: anti-periodic
  lattice_spacing: 0.1052
  anisotropy: 1.0
  quark_mass:
    light: -0.277
    strange: -0.2356
    charm: 0.4159
    bottom: 1.5
  xi_0: 1.0
  clover: 1.160920226
  multigrid:
    - - 6
      - 6
      - 6
      - 3
    - - 4
      - 4
      - 4
      - 6
  mpi_num: 4
  process_grid:
    - 1
    - 1
    - 1
    - 4

physics:
  observables:
    - id: c3_lambda_b_to_lambda_c_axial_x
      type: baryon_3pt
      name: Bare zero-recoil Lambda_b to Lambda_c+ axial-current three-point correlator with gamma_x gamma_5 at tseq=8

  hadrons:
    - id: lambda_b_src
      name: Lambda_b
      type: baryon
      flavor: udb
      momentum: [0, 0, 0]
      interpolating_operator: epsilon^{abc}(u^{Ta} C gamma_5 d^b) b^c
      subtype: heavy_baryon
    - id: lambda_c_snk
      name: Lambda_c+
      type: baryon
      flavor: udc
      momentum: [0, 0, 0]
      interpolating_operator: epsilon^{abc}(u^{Ta} C gamma_5 d^b) c^c
      subtype: heavy_baryon

  propagators:
    - id: prop_l_fwd
      quark_flavor: light
      source:
        source_type: point
        source_position: [0, 0, 0, 0]
        source_momentum: [0, 0, 0]
      gauge_field:
        stout_link_smear:
          enabled: true
          parameters:
            rho: 0.125
            n_steps: 1
            ndim: 4
      solver:
        id: clover_light
        quark_mass: -0.277
        clover_coefficient: 1.160920226
        tolerance: 1.0e-10
        maxiter: 10000
        notes: Forward light propagator from the point source; reuse the same solved propagator for both u and d spectator lines by isospin symmetry. The ensemble multigrid setup may be used here.
      sink:
        id: sink_point_light
        type: point

    - id: prop_b_fwd
      quark_flavor: custom
      source:
        source_type: point
        source_position: [0, 0, 0, 0]
        source_momentum: [0, 0, 0]
      gauge_field:
        stout_link_smear:
          enabled: true
          parameters:
            rho: 0.125
            n_steps: 1
            ndim: 4
      solver:
        id: clover_bottom_exploratory
        quark_mass: 1.5
        clover_coefficient: 1.160920226
        tolerance: 1.0e-10
        maxiter: 10000
        notes: Forward bottom-line propagator entering the final axial-current contraction. This uses the fixed ensemble clover inputs only and is not a tuned RHQ/Fermilab/NRQCD bottom action; treat the resulting correlator as exploratory, with heavy-quark discretization systematics uncontrolled. Do not assume the light-quark multigrid recipe is automatically valid for this heavy solve unless separately verified.
      sink:
        id: sink_point_bottom
        type: point

    - id: prop_c_seq
      quark_flavor: charm
      source:
        source_type: point
        source_position: [0, 0, 0, 0]
        source_momentum: [0, 0, 0]
      gauge_field:
        stout_link_smear:
          enabled: true
          parameters:
            rho: 0.125
            n_steps: 1
            ndim: 4
      solver:
        id: clover_charm_seq
        quark_mass: 0.4159
        clover_coefficient: 1.160920226
        tolerance: 1.0e-10
        maxiter: 10000
        notes: Sequential charm propagator obtained from the Lambda_c+ sink block at fixed zero momentum and tseq=8. Build the sink block from the two forward light spectator propagators, Cg5 at source and sink, and Tmat=(I+gamma_t)/2, then apply the first gamma_5 dagger before inversion and the second gamma_5 dagger after inversion.
      sink:
        id: sink_sequential_charm
        type: other

measurement:
  correlators:
    - id: measure_c3_lambda_b_to_lambda_c_axial_x
      type: baryon_3pt
      propagator: prop_c_seq
      observable: c3_lambda_b_to_lambda_c_axial_x
      inputs:
        forward_spectators:
          - prop_l_fwd
          - prop_l_fwd
        current_line: prop_b_fwd
      contraction: Final three-point observable formed from the charm sequential propagator, the forward bottom propagator, and the explicit axial current matrix Gamma_Ax = gamma_x @ gamma_5 at zero momentum; save only insertion times 1..7 for tseq=8.

output:
  format: other
  metadata: false

extras:
  - Save plain .txt output in the run directory with rows (tseq, t_ins, Re, Im) and no header or extra text.
  - Do not compute or save any 2pt correlators.
  - Use generate_einsum type=baryon_3pt with src_a=u, src_b=d, src_c=b, snk_a=u, snk_b=d, snk_c=c, current_quark=b, current_antiquark=c, projector=P_plus, diquark_gamma_src=Cg5, diquark_gamma_snk=Cg5, tseq=8 to generate the sink-block and sequential-source topology.
  - In the runtime final contraction, override the current matrix explicitly to the axial operator Gamma_Ax = gamma_x @ gamma_5; do not leave gamma_x alone as the implemented current.
  - Interpret the result only as a single bare zero-recoil exploratory 3pt correlator at one tseq, not as a controlled Lambda_b to Lambda_c form-factor determination.

freeform_plan: |
  Not used because this is a standard hadronic three-point correlator task.