task:
  name: proton_to_proton_axial_3pt_connected
  description: Compute the connected proton-to-proton three-point correlation function with a local axial current insertion J_x^A = \bar{u} gamma_x gamma_5 u, using proton interpolating operators epsilon^{abc}(u^T C gamma_5 d)u at source and sink, zero momentum, point source at [0, 0, 0, 0], positive-parity projector (I + gamma_t)/2, sink-source separation tseq = 8, stout-smeared links for all inversions, and save the final correlator to a plain txt file in the run directory.
  task_mode: standard

ensemble:
  preset: C24P29
  cfg_num:
    - '10000'
  cfg_path: /public/share/weiwang/clqcd/beta6.20_mu-0.2770_ms-0.2400_L24x72/Configurations/Original/beta6.20_mu-0.2770_ms-0.2400_L24x72_cfg_{n_cfg}.lime
  dimensions:
    - 24
    - 24
    - 24
    - 72
  boundary_conditions:
    spatial: periodic
    temporal: anti-periodic
  lattice_spacing: 0.1052
  anisotropy: 1.0
  quark_mass:
    light: -0.277
    strange: -0.2356
    charm: 0.4159
    bottom: 1.5
  xi_0: 1.0
  clover: 1.160920226
  multigrid:
    - - 6
      - 6
      - 6
      - 3
    - - 4
      - 4
      - 4
      - 6
  mpi_num: 4
  process_grid:
    - 1
    - 1
    - 1
    - 4

physics:
  observables:
    - id: pp_axial_x_3pt_connected
      type: baryon_3pt
      name: Connected proton-to-proton axial-current three-point correlator with J_x^A = bar(u) gamma_x gamma_5 u

  hadrons:
    - id: proton_src
      name: proton
      type: baryon
      flavor: uud
      momentum: [0, 0, 0]
      interpolating_operator: epsilon^{abc}(u^{Ta} C gamma_5 d^b) u^c
      subtype: source
    - id: proton_snk
      name: proton
      type: baryon
      flavor: uud
      momentum: [0, 0, 0]
      interpolating_operator: epsilon^{abc}(u^{Ta} C gamma_5 d^b) u^c
      subtype: sink

  propagators:
    - id: light_forward_point
      quark_flavor: light
      source:
        source_type: point
        source_position: [0, 0, 0, 0]
        source_momentum: [0, 0, 0]
      gauge_field:
        stout_link_smear:
          enabled: true
          parameters:
            rho: 0.125
            n_steps: 1
            ndim: 4
      solver:
        id: clover_light_forward
        quark_mass: -0.277
        clover_coefficient: 1.160920226
        tolerance: 1.0e-10
        maxiter: 10000
        notes: Forward light-quark inversion on stout-smeared links using xi_0 = 1.0 and the ensemble multigrid setup; the same light propagator is reused for both u and d lines by isospin symmetry.
      sink:
        id: sink_all_sites_forward
        type: point
    - id: light_sequential_tseq8
      quark_flavor: light
      source:
        source_type: point
        source_position: [0, 0, 0, 0]
        source_momentum: [0, 0, 0]
      gauge_field:
        stout_link_smear:
          enabled: true
          parameters:
            rho: 0.125
            n_steps: 1
            ndim: 4
      solver:
        id: clover_light_sequential
        quark_mass: -0.277
        clover_coefficient: 1.160920226
        tolerance: 1.0e-10
        maxiter: 10000
        notes: Sequential light-quark inversion from the zero-momentum proton sink block at tseq = 8 with Tmat = (I + gamma_t)/2; this yields the connected contribution only for the flavor-diagonal u-current.
      sink:
        id: proton_sink_sequential_block_t8
        type: other

measurement:
  correlators:
    - id: pp_axial_x_tseq8_connected
      type: baryon_3pt
      propagator: light_sequential_tseq8
      observable: pp_axial_x_3pt_connected

output:
  format: txt
  metadata: false

extras:
  - connected contribution only; disconnected u-loop diagrams are excluded
  - use generate_einsum once for baryon_3pt with proton source and sink, u to u current, projector P_plus, then replace the returned current matrix by gamma_x@gamma_5 explicitly in the final contraction
  - save only t_ins = 1..7 for tseq = 8
  - output columns are tseq, t_ins, Re, Im with no header
  - rank-0 only file write in the run directory
  - do not compute or save any 2pt correlator

freeform_plan: |
  Not used because this is a standard hadronic three-point task.