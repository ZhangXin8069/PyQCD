task:
  name: dplus_two_point_function_point_source
  description: Compute the zero-momentum two-point correlation function of the D+ meson on ensemble C24P29 using a point source at [0, 0, 0, 0], with all quark inversions performed on stout-smeared gauge links with parameters n_steps=1, rho=0.125, ndim=4, and save the final correlator as plain text without header in the run directory. This is a single-configuration, single-source measurement and should be treated as an execution/smoke-test correlator rather than a statistically meaningful spectroscopy result.
  task_mode: standard

ensemble:
  preset: C24P29
  cfg_num:
    - '10000'
  cfg_path: /public/share/weiwang/clqcd/beta6.20_mu-0.2770_ms-0.2400_L24x72/Configurations/Original/beta6.20_mu-0.2770_ms-0.2400_L24x72_cfg_{n_cfg}.lime
  dimensions:
    - 24
    - 24
    - 24
    - 72
  boundary_conditions:
    spatial: periodic
    temporal: anti-periodic
  lattice_spacing: 0.1052
  anisotropy: 1.0
  quark_mass:
    light: -0.277
    strange: -0.2356
    charm: 0.4159
  xi_0: 1.0
  clover: 1.160920226
  multigrid:
    - [6, 6, 6, 3]
    - [4, 4, 4, 6]
  mpi_num: 4
  process_grid:
    - 1
    - 1
    - 1
    - 4

physics:
  observables:
    - id: dplus_2pt
      type: meson_2pt
      name: D+ meson two-point correlator

  hadrons:
    - id: dplus
      name: D+
      type: meson
      flavor: anti-d plus c, charged open-charm pseudoscalar
      momentum: [0, 0, 0]
      interpolating_operator: "O_Dplus(x) = dbar(x) * gamma5 * c(x)"
      subtype: pseudoscalar

  propagators:
    - id: prop_light
      quark_flavor: light
      source:
        source_type: point
        source_position: [0, 0, 0, 0]
        source_momentum: [0, 0, 0]
      gauge_field:
        stout_link_smear:
          enabled: true
          parameters:
            rho: 0.125
            n_steps: 1
            ndim: 4
      solver:
        id: light_clover_solver
        quark_mass: -0.277
        clover_coefficient: 1.160920226
        tolerance: 1.0e-10
        maxiter: 10000
        notes: Use the ensemble clover valence action on stout-smeared links; retain multigrid for the light solve and verify achieved residual after inversion.
      sink:
        id: light_point_sink
        type: point

    - id: prop_charm
      quark_flavor: charm
      source:
        source_type: point
        source_position: [0, 0, 0, 0]
        source_momentum: [0, 0, 0]
      gauge_field:
        stout_link_smear:
          enabled: true
          parameters:
            rho: 0.125
            n_steps: 1
            ndim: 4
      solver:
        id: charm_clover_solver
        quark_mass: 0.4159
        clover_coefficient: 1.160920226
        tolerance: 1.0e-12
        maxiter: 10000
        notes: Use the ensemble-provided charm valence parameter as an existing setup on C24P29, but treat the resulting D correlator as exploratory unless this charm tuning for the stout-smeared clover action is independently validated. Do not require light-quark multigrid for the charm solve; use a standard heavy-quark inverter and verify achieved residual after inversion.
      sink:
        id: charm_point_sink
        type: point

measurement:
  correlators:
    - id: dplus_local_2pt
      type: meson_2pt
      propagator: prop_charm
      observable: dplus_2pt

output:
  format: other
  metadata: false

extras:
  - mixed-flavor meson contraction uses antiquark flavor light and quark flavor charm
  - gamma structure is gamma5 at sink and gamma5 at source
  - zero momentum is obtained by spatial sum over sink sites on each timeslice
  - write exactly three columns per row: t Re[C(t)] Im[C(t)] with no header to a .txt file in the run directory
  - use prop_light together with prop_charm in the D+ meson contraction even though the schema exposes only one propagator field in measurement

freeform_plan: |