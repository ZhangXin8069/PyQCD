task:
  name: rho_meson_connected_point_2pt_C24P29_cfg10000
  description: Compute the connected zero-momentum rho-meson two-point correlator on ensemble C24P29 for configuration 10000, using the charged isovector channel rho+ ~ bar(d) gamma_i u with i in {x,y,z}, a point source at [0, 0, 0, 0], a light-quark inversion on stout-smeared links with parameters n_steps=1, rho=0.125, ndim=4 as explicitly requested for the valence solve, average the three spatial polarizations with equal weight, and save the final headerless plain-text correlator in the run directory.
  task_mode: standard

ensemble:
  preset: C24P29
  cfg_num:
    - '10000'
  cfg_path: /public/share/weiwang/clqcd/beta6.20_mu-0.2770_ms-0.2400_L24x72/Configurations/Original/beta6.20_mu-0.2770_ms-0.2400_L24x72_cfg_{n_cfg}.lime
  dimensions:
    - 24
    - 24
    - 24
    - 72
  boundary_conditions:
    spatial: periodic
    temporal: anti-periodic
  lattice_spacing: 0.1052
  anisotropy: 1.0
  quark_mass:
    light: -0.277
    strange: -0.2356
    charm: 0.4159
  xi_0: 1.0
  clover: 1.160920226
  multigrid:
    - - 6
      - 6
      - 6
      - 3
    - - 4
      - 4
      - 4
      - 6
  mpi_num: 4
  process_grid:
    - 1
    - 1
    - 1
    - 4

physics:
  observables:
    - id: rho_2pt
      type: meson_2pt
      name: connected charged-isovector rho meson two-point function

  hadrons:
    - id: rho_plus_connected
      name: rho meson
      type: meson
      flavor: connected charged isovector light-light vector meson rho+ with degenerate u/d light propagator; this connected channel avoids disconnected contributions that would arise in neutral flavor combinations
      momentum: [0, 0, 0]
      interpolating_operator: rho_i(x)=bar(d)(x) gamma_i u(x) with i in {gamma_x,gamma_y,gamma_z}; build the correlator separately for x, y, z and average the three polarizations
      subtype: vector

  propagators:
    - id: prop_l_point_stout
      quark_flavor: light
      source:
        source_type: point
        source_position: [0, 0, 0, 0]
        source_momentum: [0, 0, 0]
      gauge_field:
        stout_link_smear:
          enabled: true
          parameters:
            rho: 0.125
            n_steps: 1
            ndim: 4
      solver:
        id: clover_light_stout_solver
        quark_mass: -0.277
        clover_coefficient: 1.160920226
        tolerance: 1.0e-10
        maxiter: 10000
        notes: Use the C24P29 valence clover operator if these ensemble-listed light-quark and clover parameters are confirmed for the intended valence action. The inversion is to be performed on the stout-smeared links as an explicit part of this requested valence solve, not merely as post-processing. One light propagator is reused for both u and d by isospin symmetry.
      sink:
        id: point_sink
        type: point

measurement:
  correlators:
    - id: rho_2pt_avg_xyz
      type: meson_2pt
      propagator: prop_l_point_stout
      observable: rho_2pt

output:
  format: other
  metadata: false

extras:
  - Write one headerless plain-text .txt file in the run directory.
  - Save rows as t Re Im with no header or extra text.
  - Generate meson_2pt contractions separately for gamma_x, gamma_y, and gamma_z, then average them with equal weight 1/3.
  - Treat this as a per-configuration data-production step only, not a statistically meaningful rho determination.
  - Confirm before execution that the C24P29 valence action is indeed clover with light mass -0.277 and cSW 1.160920226 on stout-smeared inversion links.

freeform_plan: |
  Not used because this is a standard hadron two-point correlator task.