task:
  name: eta_s_nonlocal_2pt_zmax10_point_src
  description: Compute the connected nonlocal eta_s pseudoscalar two-point correlator on ensemble C24P29 using a point source at [0, 0, 0, 0]. Use a local gamma_5 source operator and a sink operator with local antiquark field and z-displaced quark field connected by a straight Wilson line. Apply the nonlocal shift only to the quark propagator for separations n_z = 0..10 along +z. Build the Wilson line from the original gauge field, but perform strange-quark inversions on stout-smeared gauge links with parameters (n_steps=1, rho=0.125, ndim=4). Save the final correlator as plain text in the run directory with no header or extra text.
  task_mode: standard

ensemble:
  preset: C24P29
  cfg_num:
    - '10000'
  cfg_path: /public/share/weiwang/clqcd/beta6.20_mu-0.2770_ms-0.2400_L24x72/Configurations/Original/beta6.20_mu-0.2770_ms-0.2400_L24x72_cfg_{n_cfg}.lime
  dimensions:
    - 24
    - 24
    - 24
    - 72
  boundary_conditions:
    spatial: periodic
    temporal: anti-periodic
  lattice_spacing: 0.1052
  anisotropy: 1.0
  quark_mass:
    light: -0.277
    strange: -0.2356
    charm: 0.4159
  xi_0: 1.0
  clover: 1.160920226
  multigrid:
    - [6, 6, 6, 3]
    - [4, 4, 4, 6]
  mpi_num: 4
  process_grid:
    - 1
    - 1
    - 1
    - 4

physics:
  observables:
    - id: eta_s_nonlocal_2pt
      type: meson_2pt
      name: connected eta_s nonlocal pseudoscalar two-point correlator with z-directed Wilson-line displacement

  hadrons:
    - id: eta_s
      name: eta_s
      type: meson
      flavor: connected sbar s pseudoscalar proxy
      momentum: [0, 0, 0]
      interpolating_operator: O_eta_s(n_z; x) = bar{s}(x) gamma_5 W_z(x, x + n_z zhat) s(x + n_z zhat), with source operator O_eta_s(0; 0) = bar{s}(0) gamma_5 s(0), n_z = 0..10, and the Wilson-line displacement applied only to the quark field
      subtype: nonlocal_pseudoscalar

  propagators:
    - id: prop_s_point
      quark_flavor: strange
      source:
        source_type: point
        source_position: [0, 0, 0, 0]
        source_momentum: [0, 0, 0]
      gauge_field:
        stout_link_smear:
          enabled: true
          parameters:
            rho: 0.125
            n_steps: 1
            ndim: 4
      solver:
        id: strange_clover_solver
        quark_mass: -0.2356
        clover_coefficient: 1.160920226
        tolerance: null
        maxiter: null
        notes: Invert the strange propagator on the stout-smeared gauge field. Solver stopping criteria and inverter details are implementation parameters to be validated in the target software stack; the user-specified physics requirement is the stout-smeared inversion itself.
      sink:
        id: nonlocal_zero_momentum_sink
        type: other

measurement:
  correlators:
    - id: eta_s_nonlocal_zscan
      type: meson_2pt
      propagator: prop_s_point
      observable: eta_s_nonlocal_2pt
      definition: C(t,n_z) = sum_x Tr[ gamma_5 S_s(x,0) gamma_5 W_z(x, x+n_z zhat) S_s(x+n_z zhat,0) ] = sum_x Tr[ S_s^dagger(x; x0) W_z(x, x+n_z zhat) S_s(x+n_z zhat; x0) ] with x=(vec{x},t), x0=[0,0,0,0], n_z=0..10, zero-momentum projection by spatial sum, and the displaced leg taken to be the quark leg only
      sink_operator:
        antiquark_leg: local at x with gamma_5
        quark_leg: displaced to x+n_z zhat with straight Wilson line W_z built from original unsmeared gauge links
        path_convention: path-ordered straight +z transport at fixed Euclidean time t
        wrapping_rule: periodic spatial wrapping in z for every sink site and every separation n_z
      data_convention:
        value_type: complex
        storage_layout: one row per separation n_z in ascending order 0..10; for each row, columns are [Re C(t=0), Im C(t=0), Re C(t=1), Im C(t=1), ..., Re C(t=71), Im C(t=71)]
      validation:
        - Verify n_z=0 reproduces the local connected eta_s correlator built from the same stout-link propagator inversion.
        - Verify selected boundary-crossing sink sites explicitly against direct straight-line Wilson-line construction.
        - Record that this is a mixed construction by user request: stout-smeared inversion links with original-link Wilson-line transport.

output:
  format: other
  metadata: false

extras:
  - plain_txt_output_only
  - no_header_no_extra_text
  - use_original_gauge_for_wilson_line_shift
  - apply_shift_to_quark_propagator_only
  - separations_n_equal_0_to_10_along_positive_z
  - mixed_link_definition_user_requested