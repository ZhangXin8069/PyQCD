task:
  name: wilson_loop_R1_T3_avg_XT_YT_ZT
  description: Compute the rectangular Wilson loop W(R=1,T=3) on the C24P29 ensemble, averaging over the XT, YT, and ZT planes, using gauge links only and saving the final scalar result as plain text in the run directory.
  task_mode: freeform

ensemble:
  preset: C24P29
  cfg_num:
    - '10000'
  cfg_path: /public/share/weiwang/clqcd/beta6.20_mu-0.2770_ms-0.2400_L24x72/Configurations/Original/beta6.20_mu-0.2770_ms-0.2400_L24x72_cfg_{n_cfg}.lime
  dimensions:
    - 24
    - 24
    - 24
    - 72
  boundary_conditions:
    spatial: periodic
    temporal: anti-periodic
  lattice_spacing: 0.1052
  anisotropy: 1.0
  quark_mass:
    light: -0.277
    strange: -0.2356
    charm: 0.4159
  xi_0: 1.0
  clover: 1.160920226
  multigrid:
    - [6, 6, 6, 3]
    - [4, 4, 4, 6]
  mpi_num: 4
  process_grid:
    - 1
    - 1
    - 1
    - 4

physics:
  observables:
    - id: wl_R1_T3
      type: wilsonloop
      name: Rectangular Wilson loop W(R=1,T=3) averaged over XT, YT, ZT

  hadrons: []
  propagators: []

measurement:
  correlators: []

output:
  format: other
  metadata: false

extras:
  - plain_text_output_only
  - average_over_XT_YT_ZT
  - pure_gauge_no_inversions
  - mpi_grid_1_1_1_4

freeform_plan: |
  Physics goal:
  Measure the pure-gauge rectangular Wilson loop W(R=1,T=3) on each requested configuration and average the loop value over the three spatial-temporal planes XT, YT, and ZT. This is a gauge-only observable and does not use hadron operators, quark propagators, Dirac inversions, or fermion contractions.

  Observable definition:
  For each plane mu-T with mu in {X,Y,Z}, construct the closed path
  +mu, +T, +T, +T, -mu, -T, -T, -T,
  corresponding to spatial extent R=1 and temporal extent T=3. For each lattice site x, compute
  W_muT(x;1,3) = (1/Nc) Re Tr U_loop(x; mu,T; R=1,T=3),
  with Nc=3. Then average over all lattice sites and over the three planes:
  W_avg(1,3) = (1/3) [W_XT(1,3) + W_YT(1,3) + W_ZT(1,3)].

  Numerical implementation strategy:
  1. Initialize PyQUDA with lattice size [24,24,24,72] and process grid [1,1,1,4].
  2. Load the gauge configuration from the provided LIME path for cfg 10000.
  3. Move the gauge field to device memory.
  4. Do not perform any fermion-related setup.
  5. Do not apply link smearing unless explicitly requested later; use the original gauge links for this measurement.
  6. Build three rectangular loop paths:
     - XT: [X, T, T, T, -X, -T, -T, -T]
     - YT: [Y, T, T, T, -Y, -T, -T, -T]
     - ZT: [Z, T, T, T, -Z, -T, -T, -T]
  7. Call gauge.loop() with exactly four outer groups as required by PyQUDA. Pack the three active paths into the first three groups and duplicate one path in the fourth group with zero weight:
     groups = [[path_XT], [path_YT], [path_ZT], [path_XT]]
     weights = [1, 1, 1, 0]
  8. For each active returned LatticeLink field, transfer to host, reshape to per-site Nc x Nc matrices, take Re Tr for each site, and average the three plane values sitewise or after full-volume averaging.
  9. Use core.gatherLattice to gather the local per-site scalar field contributions to rank 0, then divide by total_sites * Nc and by 3 for the plane average.
  10. Write only the final numeric scalar value to a txt file in the run directory, with no header, label, or extra text, and include a trailing newline.

  Output convention:
  Produce one plain-text file for cfg 10000 in the current run directory, for example:
  wilson_loop_R1_T3_cfg10000.txt
  The file content must be exactly one line containing the final averaged scalar Wilson loop value.

  Execution notes:
  - Launch under MPI with 4 ranks consistent with process_grid [1,1,1,4].
  - Because this is a pure-gauge observable, the ensemble quark masses, clover coefficient, and multigrid parameters are recorded for provenance only and are not used in the measurement.
  - Temporal anti-periodic fermion boundary conditions are irrelevant here because only gauge links enter.
  - No analysis beyond per-configuration measurement is requested.