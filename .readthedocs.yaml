# Read the Docs build configuration (configuration file schema v2).
# Spec: https://docs.readthedocs.com/platform/stable/config-file/v2.html
# Paths below are relative to the repository root.

# Required: config file schema version.
version: 2

build:
  # Required: the build image. ubuntu-24.04 is a stable, non-"latest" image.
  os: ubuntu-24.04
  tools:
    # Required: at least one tool. Matches the Python this repo runs on (3.12).
    python: "3.12"

sphinx:
  # Required for Sphinx projects: path of conf.py, relative to the repo root.
  configuration: docs/conf.py

# Additional formats built on top of the default HTML output.
formats:
  - pdf
  - epub

python:
  install:
    # Documentation dependencies only (sphinx, sphinx-rtd-theme, myst-parser);
    # the pyqcd package itself is not installed on Read the Docs.
    - requirements: docs/requirements.txt

submodules:
  # Submodules are read-only reference libraries and are not needed for the
  # docs, so skip cloning them (the build image may not reach them anyway).
  exclude: all
