# Read the Docs build configuration (schema v2) — English site (main project).
# Spec: https://docs.readthedocs.com/platform/stable/config-file/v2.html
#
# Read the Docs project: `py-qcd` (language `en`).
# URL: https://py-qcd.readthedocs.io/en/latest/
# The Chinese build (language `zh-cn`) uses `docs/zh/.readthedocs.yaml`;
# URL: https://py-qcd.readthedocs.io/zh-cn/latest/
#
# IMPORTANT: the Read the Docs "Configuration file" setting must be pointed at
# this file (`docs/en/.readthedocs.yaml`); the repository root no longer holds a
# `.readthedocs.yaml`. All paths below are relative to the repository root.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  # English sources live in docs/en/; docs/en/conf.py does not import pyqcd.
  configuration: docs/en/conf.py

formats:
  - pdf
  - epub

python:
  install:
    - requirements: docs/en/requirements.txt

submodules:
  # Read-only reference libraries; the docs build does not need them.
  exclude: all
