# Read the Docs 构建配置（v2）—— 中文站点。
# 对应项目 `py-qcd` 的 `zh-cn` 语言版本：
#     https://py-qcd.readthedocs.io/zh-cn/latest/
# 英文版本：https://py-qcd.readthedocs.io/en/latest/
# 规范：https://docs.readthedocs.com/platform/stable/config-file/v2.html
#
# 英文站点使用 `docs/en/.readthedocs.yaml`。中文站点需在 Read the Docs
# 的（翻译）项目设置里把 "Configuration file" 指向本文件
# （文件名仍必须是 `.readthedocs.yaml`）：docs/zh/.readthedocs.yaml
#
# 本文件中的路径都相对**仓库根**。

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  # 中文源目录 docs/zh/，其 conf.py 设 language=zh_CN。
  configuration: docs/zh/conf.py

formats:
  - pdf
  - epub

python:
  install:
    - requirements: docs/zh/requirements.txt

submodules:
  # 子模块是只读参考库，文档构建不需要。
  exclude: all
