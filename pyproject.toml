# PEP 517/518 build configuration and PEP 621 metadata for the `pyqcd` distribution.
# Build-time mechanics that PEP 621 cannot express (native library staging,
# optional Cython CUDA extension, package_data) stay in setup.py.

[build-system]
requires = ["setuptools>=77", "wheel", "cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyqcd"
version = "0.4.2"
description = "Lattice QCD toolkit with a native contraction engine and an opt_einsum-compatible API."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ZhangXin8069" }]
keywords = ["lattice-qcd", "einsum", "tensor-contraction", "opt-einsum", "cuda"]
dependencies = ["numpy>=1.23", "h5py>=3.0", "scipy>=1.10"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

[project.optional-dependencies]
# Optional acceleration paths; both are imported lazily and are not required
# for the pure-Python planner.
cuda = ["cupy-cuda12x"]
torch = ["torch"]
plot = ["matplotlib>=3.6"]

[project.urls]
Documentation = "https://py-qcd.readthedocs.io/"
Homepage = "https://gitlab.itp.ac.cn/ZhangXin8069/PyQCD"
"国内开发 (GitLab)" = "https://gitlab.itp.ac.cn/ZhangXin8069/PyQCD"
"国内发布 (Gitee)" = "https://gitee.com/zhangxin8069/PyQCD"
"国外发布 (GitHub)" = "https://github.com/zhangxin8069/PyQCD"
Issues = "https://gitlab.itp.ac.cn/ZhangXin8069/PyQCD/-/issues"

[tool.setuptools]
# Wheels carry exactly the files listed in setup.py package_data; LICENSE is
# still picked up automatically by setuptools.
include-package-data = false
